name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Find APK files
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillCinema-debug
          path: '**/*.apk'
          if-no-files-found: warn
